<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HIVE Shorts - ฟีดคลิปสั้น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; background-color: #000; color: #fff; overflow: hidden; height: 100dvh; }
        .shorts-container {
            width: 100vw;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
        }
        .shorts-container::-webkit-scrollbar { display: none; }
        
        .short-item {
            width: 100vw;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }

        .short-item iframe {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform: none;
            pointer-events: none;
            object-fit: cover;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- Top Navigation Bar -->
    <header class="absolute top-0 inset-x-0 h-16 px-4 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 to-transparent pointer-events-auto">
        <a href="app.html" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition">
            <i class="ph ph-arrow-left text-[20px]"></i>
        </a>
        <h1 class="font-extrabold text-[16px] tracking-wider text-white drop-shadow">HIVE Shorts</h1>
        <button onclick="loadMoreShorts()" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition" title="โหลดคลิปใหม่">
            <i class="ph ph-arrows-clockwise text-[20px]"></i>
        </button>
    </header>

    <!-- Shorts Feed Container -->
    <div id="shorts-feed" class="shorts-container w-full max-w-md relative bg-black">
        <div class="flex flex-col items-center justify-center h-full text-center p-6">
            <i class="ph ph-spinner-gap animate-spin text-[40px] text-[#5865F2] mb-3"></i>
            <p class="text-gray-400 text-sm">กำลังเชื่อมต่อ YouTube ดึงคลิป Shorts สดๆ...</p>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyBMTXJiWCh2dL7YGqf3R3Ygc78pmUA3nYw";

        const fallbackShorts = [
            { videoId: "9bZkp7q19f0", title: "✨ บรรยากาศการทำงานใน HIVE Workspace", channelTitle: "HIVE_Creator" },
            { videoId: "3JZ_D3ELwOQ", title: "🚀 พัฒนาระบบเว็บแอปพลิเคชันด้วย AI", channelTitle: "Dev_Master" },
            { videoId: "kJQP7kiw5Fk", title: "💡 เทคนิคการเขียนโค้ดให้ไวขึ้น", channelTitle: "Code_Daily" },
            { videoId: "L_LUpnjgPso", title: "🔥 พัฒนา UI แพลตฟอร์มด้วย Tailwind CSS", channelTitle: "UI_Expert" },
            { videoId: "5qap5aO4i9A", title: "🎧 ฟังเพลง Lofi เพลินๆ ระหว่างเขียนโค้ด", channelTitle: "Lofi_Vibes" },
            { videoId: "jfKfPfyJRdk", title: "☕ โค้ดดิ้งยาวๆ ไปกับบรรยากาศสุดชิล", channelTitle: "Code_Chill" },
            { videoId: "2Vv-BfVoq4g", title: "⚡ เทคนิค JavaScript ขั้นเทพที่คุณต้องรู้", channelTitle: "JS_Master" }
        ];

        async function fetchYouTubeShorts() {
            // ปรับ URL คำขอให้เรียบง่ายและแม่นยำเพื่อป้องกัน Error 400
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=shorts&type=video&key=${YOUTUBE_API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.error) {
                    console.error("YouTube API Error:", data.error.message);
                    throw new Error(data.error.message);
                }

                if (data.items && data.items.length > 0) {
                    return data.items.map(item => ({
                        videoId: item.id.videoId,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle
                    }));
                }
            } catch (err) {
                console.error("Error fetching YouTube API:", err);
            }

            // Fallback สุ่มดึงจากรายการสำรองกรณี API ขัดข้อง
            return fallbackShorts.sort(() => Math.random() - 0.5);
        }

        async function renderShortsFeed() {
            const feedContainer = document.getElementById('shorts-feed');
            feedContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center p-6">
                    <i class="ph ph-spinner-gap animate-spin text-[40px] text-[#5865F2] mb-3"></i>
                    <p class="text-gray-400 text-sm">กำลังโหลดฟีดคลิปสั้น...</p>
                </div>
            `;
            
            const shortsList = await fetchYouTubeShorts();
            feedContainer.innerHTML = '';

            shortsList.forEach((short) => {
                appendShortItem(feedContainer, short);
            });
        }

        async function loadMoreShortsFeed() {
            const feedContainer = document.getElementById('shorts-feed');
            const shortsList = await fetchYouTubeShorts();
            shortsList.forEach((short) => {
                appendShortItem(feedContainer, short);
            });
            window.isLoadingMore = false;
        }

        function appendShortItem(container, short) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'short-item w-full flex items-center justify-center bg-zinc-950 relative overflow-hidden';
            
            itemDiv.innerHTML = `
                <div class="absolute inset-0 w-full h-full pointer-events-none overflow-hidden">
                    <iframe src="https://www.youtube.com/embed/${short.videoId}?autoplay=1&mute=0&controls=0&loop=1&playlist=${short.videoId}&playsinline=1&disablekb=1&modestbranding=1&iv_load_policy=3&enablejsapi=1" 
                        title="YouTube Short" frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>

                <div class="absolute right-4 bottom-20 flex flex-col items-center space-y-6 z-30 pointer-events-auto">
                    <button onclick="toggleLike(this)" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:scale-110 transition shadow-lg">
                        <i class="ph-fill ph-heart text-[26px]"></i>
                    </button>
                    <span class="text-xs font-bold drop-shadow">12.5K</span>

                    <button onclick="shareClip()" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white hover:scale-110 transition shadow-lg">
                        <i class="ph-fill ph-share-fat text-[24px]"></i>
                    </button>
                    <span class="text-xs font-bold drop-shadow">แชร์</span>
                </div>

                <div class="absolute left-4 bottom-8 right-20 z-30 pointer-events-auto drop-shadow-md">
                    <div class="flex items-center space-x-3 mb-2">
                        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white border border-white/20">${short.channelTitle.charAt(0)}</div>
                        <span class="font-bold text-[15px] text-white">@${short.channelTitle}</span>
                        <button class="bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold px-3 py-1 rounded-full transition">ติดตาม</button>
                    </div>
                    <p class="text-[13px] text-gray-200 line-clamp-2">${short.title} #shorts #hiveworkspace</p>
                </div>
            `;
            container.appendChild(itemDiv);
        }

        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            icon.classList.toggle('text-red-500');
            icon.classList.toggle('ph-fill');
            icon.classList.toggle('ph');
            btn.classList.add('scale-125');
            setTimeout(() => btn.classList.remove('scale-125'), 200);
        }

        function shareClip() {
            if (navigator.share) {
                navigator.share({ title: 'HIVE Shorts', url: window.location.href }).catch(() => {});
            } else {
                alert('คัดลอกลิงก์สำเร็จ!');
            }
        }

        function loadMoreShorts() {
            const feedContainer = document.getElementById('shorts-feed');
            feedContainer.scrollTop = 0;
            renderShortsFeed();
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderShortsFeed, 500);
        });

        const feedContainer = document.getElementById('shorts-feed');
        feedContainer.addEventListener('scroll', () => {
            const threshold = feedContainer.scrollHeight - feedContainer.clientHeight - 150;
            if (feedContainer.scrollTop >= threshold) {
                if (!window.isLoadingMore) {
                    window.isLoadingMore = true;
                    loadMoreShortsFeed();
                }
            }
        });
    </script>
</body>
</html>
